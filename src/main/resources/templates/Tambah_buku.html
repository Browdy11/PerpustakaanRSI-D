<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Buku</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/}">Beranda</a>
    <a th:href="@{/buku}">Buku</a>
    <a th:href="@{/anggota}">Anggota</a>
</div>

<div class="container">
    <h1>Tambah Buku</h1>
    <p>Isi form di bawah ini untuk menambahkan data buku baru.</p>

    <form class="stack" th:action="@{/buku}" method="post">
        <label>ID Buku</label>
        <input name="idBuku" placeholder="Contoh: B004" required>

        <label>Judul</label>
        <input name="judul" placeholder="Judul buku" required>

        <label>Stok</label>
        <input name="stok" type="number" min="0" value="1">

        <button type="submit">Simpan</button>
    </form>

    <p class="back-link"><a th:href="@{/buku}">&larr; Kembali ke Daftar Buku</a></p>
</div>

</body>
</html>
