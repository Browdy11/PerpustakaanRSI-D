<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Anggota</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/}">Beranda</a>
    <a th:href="@{/buku}">Buku</a>
    <a th:href="@{/anggota}">Anggota</a>
</div>

<div class="container">
    <h1>Daftar Anggota</h1>

    <form class="stack" th:action="@{/anggota}" method="get">
        <label>Cari nama</label>
        <input name="kata" th:value="${kata}" placeholder="Cari nama">
        <button type="submit">Cari</button>
    </form>

    <table>
        <tr><th>ID</th><th>Nama</th><th>Alamat</th></tr>
        <tr th:each="a : ${daftarAnggota}">
            <td th:text="${a.idAnggota}">A001</td>
            <td th:text="${a.nama}">Nama anggota</td>
            <td th:text="${a.alamat}">Alamat</td>
        </tr>
    </table>

    <h2><a th:href="@{/anggota/tambah}">Tambah Anggota</a></h2>
</div>

</body>
</html>
