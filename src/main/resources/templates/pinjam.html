<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pinjam Buku</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/}">Beranda</a>
    <a th:href="@{/buku}">Buku</a>
    <a th:href="@{/anggota}">Anggota</a>
    <a th:href="@{/peminjaman}">Peminjaman</a>
</div>

<div class="container">
    <h1>Pinjam Buku</h1>
    <p>Pilih anggota dan buku yang akan dipinjam.</p>

    <p th:if="${error}" style="color: red; font-weight: bold;" th:text="${error}"></p>

    <form class="stack" th:action="@{/peminjaman}" method="post">
        <label>Anggota</label>
        <select name="idAnggota" required>
            <option value="">-- Pilih Anggota --</option>
            <option th:each="a : ${daftarAnggota}"
                    th:value="${a.idAnggota}"
                    th:text="${a.nama} + ' (' + ${a.idAnggota} + ')'">
            </option>
        </select>

        <label>Buku</label>
        <select name="idBuku" required>
            <option value="">-- Pilih Buku --</option>
            <option th:each="b : ${daftarBuku}"
                    th:value="${b.idBuku}"
                    th:text="${b.judul} + ' (stok: ' + ${b.stok} + ')'">
            </option>
        </select>

        <button type="submit">Pinjam</button>
    </form>

    <p class="back-link"><a th:href="@{/peminjaman}">&larr; Kembali ke Daftar Peminjaman</a></p>
</div>

</body>
</html>
