<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Anggota</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/}">Beranda</a>
    <a th:href="@{/buku}">Buku</a>
    <a th:href="@{/anggota}">Anggota</a>
    <a th:href="@{/peminjaman}">Peminjaman</a>
</div>

<div class="container">
    <h1>Tambah Anggota</h1>
    <p>Isi form di bawah ini untuk menambahkan data anggota baru.</p>

    <form class="stack" th:action="@{/anggota}" method="post">
        <label>ID Anggota</label>
        <input name="idAnggota" placeholder="Contoh: A004" required>

        <label>Nama</label>
        <input name="nama" placeholder="Nama lengkap" required>

        <label>Alamat</label>
        <input name="alamat" placeholder="Alamat">

        <button type="submit">Simpan</button>
    </form>

    <p class="back-link"><a th:href="@{/anggota}">&larr; Kembali ke Daftar Anggota</a></p>
</div>

</body>
</html>
