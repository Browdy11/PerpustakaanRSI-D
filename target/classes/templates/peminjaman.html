<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Peminjaman</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <a th:href="@{/}">Beranda</a>
    <a th:href="@{/buku}">Buku</a>
    <a th:href="@{/anggota}">Anggota</a>
    <a th:href="@{/peminjaman}">Peminjaman</a>
</div>

<div class="container">
    <h1>Daftar Peminjaman</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Buku</th>
            <th>Anggota</th>
            <th>Tgl Pinjam</th>
            <th>Tgl Kembali</th>
            <th>Status</th>
            <th>Aksi</th>
        </tr>
        <tr th:each="p : ${daftarPeminjaman}">
            <td th:text="${p.idPeminjaman}">PJ001</td>
            <td th:text="${p.judulBuku}">Judul buku</td>
            <td th:text="${p.namaAnggota}">Nama anggota</td>
            <td th:text="${p.tanggalPinjam}">2026-01-01</td>
            <td th:text="${p.tanggalKembali} ?: '-'">-</td>
            <td th:text="${p.status}">DIPINJAM</td>
            <td>
                <form th:if="${p.status == 'DIPINJAM'}"
                      th:action="@{'/peminjaman/kembalikan/' + ${p.idPeminjaman}}"
                      method="post">
                    <button type="submit">Kembalikan</button>
                </form>
            </td>
        </tr>
    </table>

    <h2><a th:href="@{/peminjaman/pinjam}">Pinjam Buku</a></h2>
</div>

</body>
</html>
